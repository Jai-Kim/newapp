# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/lint-ts.yml

# ✍️ Description:
# Runs eslint on pull requests and on pushes to main/master.
#
# `pnpm lint` is the gate and runs on every event. reviewdog additionally
# annotates pull requests inline, but it cannot be the gate: its default
# filter only looks at changed lines and it does not fail the job, so a lint
# error anywhere else merges unnoticed. main drifted red across three merges
# that way before this was fixed.

# 🚨 GITHUB SECRETS REQUIRED: NONE

name: Lint TS (eslint, prettier)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint TS (eslint, prettier)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      # Annotations only. Explicitly allowed to fail so a reviewdog outage or
      # a token permission change can never be the reason a lint error slips
      # through — the gate below is what decides.
      - name: 💬 Annotate the PR inline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '. --ext .js,.jsx,.ts,.tsx'

      # The gate. Same command a developer runs locally, on every event.
      - name: 🏃‍♂️ Run ESLint
        run: pnpm run lint
