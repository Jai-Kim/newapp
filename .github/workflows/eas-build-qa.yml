# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/eas-build-qa.yml
# Starter releasing process: https://starter.obytes.com/ci-cd/app-releasing-process/

# ✍️ Description:
# This workflow is used to trigger a build on EAS for the QA environment.
# It will run on every GitHub release published on the repo or can be triggered manually from the actions tab.
# This workflow will use ./actions/eas-build action to trigger the build on EAS with staging env.

# 🚨 GITHUB SECRETS REQUIRED:
#         - EXPO_TOKEN: Expo token to authenticate with EAS
#         - You can get it from https://expo.dev/settings/access-tokens

name: EAS QA Build (Android & IOS) (EAS)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  Build:
    name: EAS QA Build (Android & IOS) (EAS)
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: ⏱️ EAS Build
        uses: ./.github/actions/eas-build
        with:
          # Was `staging`, which is not a thing here: the composite action runs
          # `pnpm prebuild:$APP_ENV` and `pnpm build:$APP_ENV:android`, and this
          # repo only has development, preview and production. Any dispatch of
          # this workflow failed at the prebuild step.
          APP_ENV: preview
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
          IOS: false # TODO: set as true when IOS account is ready

      # The build is queued with --no-wait, so the job would otherwise end
      # before there is anything to install. This surfaces the page to share
      # and, once the build finishes, the APK itself.
      - name: 🔗 Wait for the build and print the install link
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            build=$(eas build:list --platform android --limit 1 --json --non-interactive)
            status=$(echo "$build" | jq -r '.[0].status')
            page=$(echo "$build" | jq -r '.[0].buildDetailsPageUrl // empty')
            artifact=$(echo "$build" | jq -r '.[0].artifacts.buildUrl // empty')
            echo "status=$status"
            if [ "$status" = "FINISHED" ]; then
              {
                echo "### Android preview build ready"
                echo ""
                echo "- Install (APK): $artifact"
                echo "- Build page: $page"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "INSTALL_URL=$artifact"
              echo "BUILD_PAGE=$page"
              exit 0
            fi
            if [ "$status" = "ERRORED" ] || [ "$status" = "CANCELED" ]; then
              echo "build $status — see $page"
              exit 1
            fi
            sleep 30
          done
          echo "timed out waiting for the build; check the EAS dashboard"
          exit 1
